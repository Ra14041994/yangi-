<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantiqiy savol</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
            --accent: #4f46e5;
            --ok: #16a34a;
            --ok-bg: #dcfce7;
            --bad: #dc2626;
            --bad-bg: #fee2e2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --card: #1f2937;
                --text: #f3f4f6;
                --muted: #9ca3af;
                --border: #374151;
                --accent: #818cf8;
                --ok: #4ade80;
                --ok-bg: #14532d;
                --bad: #f87171;
                --bad-bg: #7f1d1d;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
        }

        .label {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 20px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .options button {
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .options button:hover:not(:disabled) { border-color: var(--accent); }
        .options button:disabled { cursor: default; }
        .options button.correct { border-color: var(--ok); background: var(--ok-bg); }
        .options button.wrong { border-color: var(--bad); background: var(--bad-bg); }

        .result {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .result strong.ok { color: var(--ok); }
        .result strong.bad { color: var(--bad); }

        .retry {
            margin-top: 16px;
            padding: 10px 18px;
            font-size: 15px;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <p class="label">Mantiqiy savol</p>
        <h1>Otaning 5 ta qizi bor. Har bir qizning bittadan akasi bor. Oilada jami nechta farzand bor?</h1>

        <div class="options" id="options">
            <button type="button" data-answer="6">6</button>
            <button type="button" data-answer="10">10</button>
            <button type="button" data-answer="11">11</button>
            <button type="button" data-answer="5">5</button>
        </div>

        <div class="result" id="result" hidden></div>
        <button type="button" class="retry" id="retry" hidden>Qaytadan urinish</button>
    </main>

    <script>
        const CORRECT = "6";
        const EXPLANATION = "Barcha 5 ta qizning akasi bitta — o'sha bir o'g'il. Demak, 5 qiz + 1 o'g'il = 6 farzand.";

        const buttons = document.querySelectorAll("#options button");
        const result = document.getElementById("result");
        const retry = document.getElementById("retry");

        buttons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                const isCorrect = btn.dataset.answer === CORRECT;

                buttons.forEach(function (b) {
                    b.disabled = true;
                    if (b.dataset.answer === CORRECT) b.classList.add("correct");
                });
                if (!isCorrect) btn.classList.add("wrong");

                result.innerHTML = isCorrect
                    ? '<strong class="ok">To\'g\'ri!</strong> ' + EXPLANATION
                    : '<strong class="bad">Noto\'g\'ri.</strong> To\'g\'ri javob: 6. ' + EXPLANATION;
                result.hidden = false;
                retry.hidden = false;
            });
        });

        retry.addEventListener("click", function () {
            buttons.forEach(function (b) {
                b.disabled = false;
                b.classList.remove("correct", "wrong");
            });
            result.hidden = true;
            retry.hidden = true;
        });
    </script>
</body>
</html>
